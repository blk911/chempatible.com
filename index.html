const core=[['Truth when it costs something','When the truth may disappoint someone you like, what do you do?',['Tell them directly, with care.','Say most of it gently.','Wait for a better moment.','Leave it alone if it seems unhelpful.']],['Communication when something feels off','Someone says “I’m fine,” but you sense something is wrong. What happens next?',['Ask once and make room to talk.','Let them know I am here when ready.','Try to solve it.','Give space until they approach me.']],['Repair after conflict','You still think you were right after a disagreement. What do you do next?',['Ask how they experienced it.','Own my part first.','Wait to cool off.','Leave it unless they bring it up.']],['Respect for boundaries','Someone you like says a behavior is not okay with them. Your first move?',['Listen and ask what they need.','Explain what I meant, then listen.','Take time before responding.','Decide whether that boundary works for me.']],['Keeping agreements','You promised to call tonight, but cannot. What do you do?',['Let them know before the agreed time.','Call later and explain.','Apologize tomorrow.','Assume they will understand.']]];
const nextFive=[['Emotional expression','After a hard day, what would you tell someone you are getting close to?',['I care, and I need a little time.','I could use comfort.','I am not sure what I feel yet.','I would rather keep things light.']],['Closeness and independence','When a connection gets serious, what tends to matter most?',['Feeling understood.','Knowing where I stand.','Keeping room for myself.','Seeing actions match words.']],['Responsiveness','If someone important texts during a busy day, what is your usual move?',['Send a quick acknowledgment.','Reply when I can give it attention.','Call when free.','Respond when my day is over.']],['Non-negotiables','A new partner has a firm preference you do not share. What do you do?',['Ask why it matters to them.','Explain my position and look for room.','Take time to decide if it works.','Treat it as a sign we may differ.']],['Commitments and agreements','You and someone you date set a plan, then a better invitation arrives. What do you do?',['Keep the plan we made.','Ask whether changing it is okay.','Suggest another time.','Choose what makes sense that day.']]];

let state={view:'landing',viewer:'Cindy',cindy:{name:'Cindy',contact:'cindy@example.com',photo:''},mike:{name:'',contact:'',photo:''},phase:'unscanned',question:0,pick:null,answers:{Mike:[],Cindy:[]},more:{Mike:null,Cindy:null},thread:[]};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function who(n){return n==='Cindy'?state.cindy:state.mike}function face(n){let x=who(n);return `<span class="face">${x.photo?`<img src="${x.photo}" alt="${esc(x.name)} selfie">`:esc((x.name||n)[0])}</span>`}function btn(label,fn,variant=''){return `<button class="button ${variant}" onclick="${fn}">${label}</button>`}function render(){let v=state.viewer,person=who(v),other=v==='Cindy'?'Mike':'Cindy';$('navUser').innerHTML=state.view==='landing'?'':`<div class="user">${face(v)}<span><b>${esc(person.name||v)}</b><br><span class="contact">${esc(person.contact)}</span></span><button class="switch" onclick="switchPerson()">View as ${other}</button></div>`;let html='';if(state.view==='landing')html=`<div class="intro"><div class="eyebrow">CHEMPATIBILITY</div><div class="heroAction"><div><h1>Chem-<em>patibility</em>: IYKYK!</h1><p>Chemistry and compatibility make for the memories.</p></div>${btn('INSTANT VIBE →','openConnect()','alt')}</div></div><div class="layout joinLayout"><div class="box"><h2>Three steps. You’re in.</h2><p>Tell us who’s joining.</p><label class="field" for="joinName">Your name<input id="joinName" autocomplete="name" placeholder="First name" maxlength="50"></label><label class="field" for="joinContact">Email or cell<input id="joinContact" autocomplete="email" placeholder="you@example.com or your cell"></label><div class="small">1. Your name and contact &nbsp; 2. Your selfie &nbsp; 3. Your page</div><div class="row finishRow">${btn('FINISH — OPEN MY PAGE →','finishInline()')}</div></div><div class="box"><h2>Smile. This is you.</h2><p>Open the camera on your phone. Give them a face to meet when the conversation starts.</p><div id="selfieFrame" class="selfieFrame"><span class="selfieGlyph">☺</span><strong>Your selfie goes here</strong><small>A current photo, taken now</small></div><video id="joinCamera" class="capture" autoplay playsinline muted style="display:none;width:180px;height:180px;aspect-ratio:1;object-fit:cover"></video><canvas id="joinCanvas" hidden></canvas><img id="joinPreview" class="capture" alt="Your captured selfie" style="display:none;width:180px;height:180px;aspect-ratio:1;object-fit:cover"><div id="joinError" class="small" role="alert"></div><div class="row">${btn('OPEN CAMERA','openJoinCamera()','alt')}${btn('SMILE & CAPTURE','takeJoinSelfie()','light')}</div><div class="mutedline">This local prototype keeps your details in this browser tab.</div></div></div><section class="sample" aria-label="Member page example"><div class="sampleHead"><div><div class="eyebrow">A LOOK INSIDE</div><h2>Where your connections begin.</h2></div><span class="small">Sample member view</span></div><div class="sampleShell"><div class="sampleNav"><div class="logo">CHEM<span>PATIBILITY</span></div><div class="sampleIdentity"><span class="face">C</span><span><b>Cindy</b><br>cindy@example.com · Cell private</span></div></div><div class="sampleBody"><div class="sampleLeft"><div class="eyebrow">MY PAGE</div><h2 style="margin-top:8px">Hi, Cindy.</h2><div class="sampleQrRow"><div class="qr" aria-label="QR placement in sample"><span>YOUR QR</span></div><div><h3>Start with a scan.</h3><p>Meet someone interesting? Show your code. They’ll see your introduction and answer your first five.</p><span class="small">Your actual QR appears when your page is active.</span></div></div><div class="sampleSub">MY 10 · WHAT MATTERS TO ME</div><ol class="samplePriorities">${priorities.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div><div class="sampleRight"><div class="sampleSub" style="margin-top:0">CONNECTIONS</div><div class="sampleConnection"><span class="face">M</span><span><b>Mike</b><small>Five answered · Your move</small></span><span style="margin-left:auto">→</span></div><div class="sampleSub">CINDY + MIKE</div><div class="sampleTranscript"><strong>Mike answered your first five.</strong>Read his answers, then the system sends his next five to you. After you both answer, each of you privately chooses MORE or THANK YOU.</div><div class="sampleNotice">Every person gets a separate connection space for questions, reveals and conversation.</div></div></div></div></section>`;
if(state.view==='signup')html=`<div class="intro"><div class="eyebrow">STEP 1 OF 2</div><h1>Your introduction.</h1></div><div class="box" style="max-width:560px"><label class="field">Name<input id="newName" value="${esc(person.name)}" autocomplete="given-name"></label><label class="field">Email or cell<input id="newContact" value="${esc(person.contact)}" autocomplete="email"></label><div class="row">${btn('NEXT: LIVE SELFIE →','captureScreen()')}</div></div>`;
if(state.view==='camera')html=`<div class="intro"><div class="eyebrow">STEP 2 OF 2</div><h1>Take a selfie.</h1><p>This photo belongs to your introduction. The camera capture stays in this browser demo.</p></div><div class="box" style="max-width:560px"><video id="video" class="capture" autoplay playsinline muted></video><canvas id="canvas" hidden></canvas><img id="snapshot" class="capture" alt="Your captured selfie" style="display:none"><div class="row">${btn('TAKE SELFIE','snap()')}${btn('OPEN MY PAGE →','finishSignup()','alt')}</div><div class="mutedline">Camera permission and a secure local origin are required. You can explore the demo without a photo.</div></div>`;
if(state.view==='dashboard'){let status=state.phase==='unscanned'?'Ready for a scan':state.phase==='closed'?'Connection closed':state.phase==='connected'?'Connected':state.phase==='more_cindy'||state.phase==='more_mike'?'Choosing MORE':state.phase==='reveal'?'Photo reveal':'Questions in progress';html=`<div class="intro"><div class="eyebrow">MY PAGE</div><h1>Hi, ${esc(person.name||v)}.</h1><p>Meet, ask, answer, and keep the conversation moving.</p></div><div class="connectStrip"><div><div class="eyebrow">YOUR NEXT CONNECTION</div><h2>Someone caught your interest?</h2><p>Open your invitation. Show it in person or start with their name and contact.</p></div>${btn('CONNECT NOW →','openConnect()')}</div><div class="layout"><div class="stack"><div class="box"><div class="topline"><h2>My QR</h2><span class="small">Ready to meet</span></div><p>When you meet someone interesting, ask them to scan. Their first move opens your five most important questions.</p><div class="qr" aria-label="Demo scan marker"><span>SCAN TO START</span></div><div class="row">${btn('SIMULATE A SCAN →','scan()')}</div><div class="mutedline">Visual demo marker; a real scannable QR comes with account and link setup.</div></div><div class="box"><h2>My 10</h2><p>What you most want to understand. Your top five lead the first exchange.</p><ol class="list">${priorities.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="mutedline">Starter priorities for this walkthrough. Editing and a 50-question bank come next.</div></div></div><div class="box"><h2>Connections</h2>${state.phase==='unscanned'?'<p>No connection yet. A scan begins a private space for two people.</p>':`<button class="connection" onclick="workspace()">${face(other)}<span><strong>${esc(who(other).name||other)}</strong><small>${status} · ${nextMove()}</small></span><span style="margin-left:auto">→</span></button>`}</div></div>`}
if(state.view==='scan')html=`<div class="intro"><div class="eyebrow">CINDY’S INTRODUCTION</div><h1>Hi, I’m Cindy.</h1><p>You scanned my code. Let’s see how we relate, starting with five things that matter to me.</p></div><div class="layout"><div class="box">${face('Cindy')}<h2 style="margin-top:18px">Cindy</h2><p>“Let’s see if we’re Chempatible.”</p><div class="row">${btn('START CINDY’S FIVE →','begin()')}</div></div><div class="box"><h3>How this works</h3><p>You answer Cindy’s five. The system then sends your next five to Cindy. You both see each other’s answers before privately choosing MORE or THANK YOU.</p></div></div>`;
if(state.view==='workspace'){let phase=state.phase,active=phase==='cindy5'?'Mike':phase==='mike5'?'Cindy':phase==='more_mike'?'Mike':phase==='more_cindy'?'Cindy':null;let top=`<div class="intro"><div class="eyebrow">PRIVATE CONNECTION</div><h1>Cindy + ${esc(state.mike.name||'Mike')}</h1><p>One space for your questions, answers, choices and conversation.</p></div><div class="trail">${['Cindy’s 5','Mike’s 5','Choose','Reveal','Conversation'].map((x,i)=>`<span class="${(['cindy5','mike5','more_mike','more_cindy','reveal','connected'].indexOf(phase)>=i&&i===Math.min(['cindy5','mike5','more_mike','more_cindy','reveal','connected'].indexOf(phase),4))?'now':''}">${x}</span>`).join('')}</div>`;let body='';if(phase==='cindy5'||phase==='mike5'){let bank=phase==='cindy5'?core:nextFive,asking=phase==='cindy5'?'Cindy':'Mike',q=bank[state.question];if(v!==active)body=`<div class="box"><h2>Waiting on ${active}.</h2><p>${asking}’s five questions have been sent. Switch views to see the move ${active} received.</p></div>`;else body=`<div class="ask"><div class="eyebrow">${asking.toUpperCase()} ASKED · ${state.question+1} OF 5</div><h2>${esc(q[1])}</h2><p>${esc(q[0])}</p>${q[2].map((x,i)=>`<button class="option ${state.pick===i?'on':''}" onclick="pick(${i})">${'ABCD'[i]}. ${esc(x)}</button>`).join('')}<div class="row">${btn(state.question===4?'SEND FIVE ANSWERS →':'NEXT QUESTION →','answer()')}</div></div>`}if(phase==='more_mike'||phase==='more_cindy'){let receiving=phase==='more_mike'?'Mike':'Cindy',bank=phase==='more_mike'?nextFive:core,personAnswered=phase==='more_mike'?'Cindy':'Mike',answers=state.answers[personAnswered];body=`<div class="box"><div class="eyebrow">${esc(personAnswered.toUpperCase())} ANSWERED</div><h2>${v===receiving?`Read ${personAnswered}’s answers.`:`Waiting on ${receiving}’s private choice.`}</h2>${v===receiving?bank.map((q,i)=>`<div class="answer"><b>${esc(q[1])}</b>${esc(q[2][answers[i]])}</div>`).join('')+`<div class="row">${btn('MORE — KEEP GOING','choose("more")')}${btn('THANK YOU — WISH YOU WELL','choose("thankyou")','light')}</div>`:'<p>Switch views to continue.</p>'}</div>`}if(phase==='reveal')body=`<div class="box"><div class="eyebrow">BOTH CHOSE MORE</div><h2>A little more of each other.</h2><p>Next, each person chooses a photo to reveal. Once both commit, they can explore a deeper question or a shared test such as love language. This is where the connection grows.</p><div class="row">${btn('ENTER OUR CONVERSATION →','connect()')}</div></div>`;if(phase==='closed')body=`<div class="box"><h2>Thank you for showing up.</h2><p>This connection ends here. Wishing you both the best.</p></div>`;if(phase==='connected')body=`<div class="box"><h2>Your space together.</h2><p>Continue the conversation. Love language, attachment and other shared inquiries will appear here as the relationship progresses.</p><div class="banner">Next pieces: reciprocal photo reveal · love language · attachment inquiry</div><div id="messages">${state.thread.map(m=>`<div class="answer"><b>${esc(m.from)}</b>${esc(m.text)}</div>`).join('')}</div><label class="field">Message as ${esc(v)}<input id="message" placeholder="Say something…"></label><div class="row">${btn('SEND','send()')}</div></div>`;html=top+`<div class="layout"><div>${body}</div><div class="stack"><div class="box"><h3>Connection</h3><div class="row">${face('Cindy')}${face('Mike')}</div><p class="small">${nextMove()}</p><button class="switch" onclick="home()">← My page</button></div><div class="box"><h3>How it unfolds</h3><p>Cindy asks five → Mike answers → Mike’s next five go to Cindy → Cindy answers → both privately choose.</p></div></div></div>`} $('root').innerHTML=html;renderConnectModal()}
function renderConnectModal(){let host=$('modalHost');if(!state.connectOpen){host.innerHTML='';return}let person=who(state.viewer),name=esc(state.view==='landing'?'Cindy':person.name||state.viewer),manual=state.connectMode==='manual',photo=state.view!=='landing'&&person.photo?`<img src="${person.photo}" alt="${name}'s selfie">`:`<span class="inviteInitial">${name[0]}</span>`;host.innerHTML=`<div class="modalBackdrop" onclick="closeConnect(event)"><section class="connectModal inviteModal" role="dialog" aria-modal="true" aria-labelledby="connectTitle"><button class="modalClose" aria-label="Close invitation" onclick="closeConnect()">×</button><div class="eyebrow">${manual?'SEND AN INVITATION':name.toUpperCase()+' INVITES YOU'}</div><h2 id="connectTitle">${manual?'I caught your vibe. Let’s talk.':'Scan the code. I’ll tell you FIVE secrets about me! Wanna play?'}</h2>${manual?`<div class="inviteForm"><label class="field" for="inviteName">Their name<input id="inviteName" placeholder="First name" maxlength="50" autocomplete="given-name"></label><label class="field" for="inviteContact">Email or cell<input id="inviteContact" placeholder="Email or cell" autocomplete="off"></label><div id="inviteError" class="small" role="alert"></div><div class="row">${btn('SEND INVITATION →','prepareInvite()')}</div><button class="flipLink" onclick="setConnectMode('qr')">← Show QR instead</button><p class="small">Local preview: Send prepares the connection here; delivery between phones comes with the live site.</p></div>`:`<div class="invitePair"><div class="invitePortrait">${photo}<b>${name}</b></div><div class="qr" aria-label="QR preview, not yet scannable"><span>SCAN ME</span></div></div><button class="flipLink" onclick="setConnectMode('manual')">Can’t scan? Send it instead →</button>`}</section></div>`}function setConnectMode(mode){state.connectMode=mode;renderConnectModal()}function previewInvite(){state.connectOpen=false;scan()}function openConnect(){state.connectOpen=true;state.connectMode='qr';renderConnectModal()}function closeConnect(event){if(event&&event.target!==event.currentTarget)return;state.connectOpen=false;renderConnectModal()}function prepareInvite(){let n=$('inviteName').value.trim(),c=$('inviteContact').value.trim();if(!n||!c){$('inviteError').textContent='Enter their name and email or cell.';return}state.mike.name=n;state.mike.contact=c;state.connectOpen=false;state.phase='unscanned';state.view='dashboard';render();alert('Invitation prepared for '+n+'. Delivery between phones will be enabled with the hosted connection link.')}document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.connectOpen)closeConnect()});function nextMove(){return ({unscanned:'Awaiting scan',cindy5:'Mike answers Cindy’s five',mike5:'Cindy answers Mike’s five',more_mike:'Mike chooses privately',more_cindy:'Cindy chooses privately',reveal:'Both chose MORE',connected:'Conversation open',closed:'Closed'})[state.phase]}async function openJoinCamera(){let error=$('joinError');error.textContent='';if(!navigator.mediaDevices?.getUserMedia){error.textContent='Camera access needs a secure browser page on your phone.';return}try{window.joinStream?.getTracks().forEach(t=>t.stop());window.joinStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});let video=$('joinCamera');video.srcObject=window.joinStream;video.style.display='block';$('selfieFrame').style.display='none';$('joinPreview').style.display='none';state.pendingPhoto=''}catch(e){error.textContent='Camera unavailable. Allow camera access and try again on your phone.'}}function takeJoinSelfie(){let video=$('joinCamera');if(!video?.videoWidth){$('joinError').textContent='Open the phone camera first.';return}let canvas=$('joinCanvas');canvas.width=320;canvas.height=320;let ctx=canvas.getContext('2d'),size=Math.min(video.videoWidth,video.videoHeight);ctx.drawImage(video,(video.videoWidth-size)/2,(video.videoHeight-size)/2,size,size,0,0,320,320);state.pendingPhoto=canvas.toDataURL('image/jpeg',.8);$('joinPreview').src=state.pendingPhoto;$('joinPreview').style.display='block';$('selfieFrame').style.display='none';video.style.display='none';window.joinStream?.getTracks().forEach(t=>t.stop());window.joinStream=null;$('joinError').textContent='Selfie captured. You’re ready to finish.'}function finishInline(){let name=$('joinName').value.trim(),contact=$('joinContact').value.trim();if(!name||!contact||!state.pendingPhoto){$('joinError').textContent='Enter your name and email or cell, then add a selfie.';return}state.cindy={name,contact,photo:state.pendingPhoto};state.pendingPhoto='';window.joinStream?.getTracks().forEach(t=>t.stop());window.joinStream=null;state.viewer='Cindy';state.view='dashboard';render();window.scrollTo(0,0)}function signup(){state.view='signup';render()}function captureScreen(){let n=$('newName').value.trim(),c=$('newContact').value.trim();if(!n||!c){alert('Enter a name and email or cell.');return}Object.assign(who(state.viewer),{name:n,contact:c});state.view='camera';render();navigator.mediaDevices?.getUserMedia({video:{facingMode:'user'},audio:false}).then(stream=>{$('video').srcObject=stream;window.activeStream=stream}).catch(()=>{})}function snap(){let video=$('video');if(!video?.videoWidth){alert('Camera unavailable. You can continue exploring the demo.');return}let canvas=$('canvas');canvas.width=320;canvas.height=240;canvas.getContext('2d').drawImage(video,0,0,320,240);who(state.viewer).photo=canvas.toDataURL('image/jpeg',.75);$('snapshot').src=who(state.viewer).photo;$('snapshot').style.display='block';video.style.display='none';window.activeStream?.getTracks().forEach(t=>t.stop())}function finishSignup(){window.activeStream?.getTracks().forEach(t=>t.stop());state.view='dashboard';render()}function home(){state.view='dashboard';render()}function switchPerson(){window.activeStream?.getTracks().forEach(t=>t.stop());state.viewer=state.viewer==='Cindy'?'Mike':'Cindy';state.view=state.phase==='unscanned'?'dashboard':state.view==='workspace'?'workspace':'dashboard';render()}function scan(){state.viewer='Mike';state.view='scan';if(!state.mike.name)state.mike={name:'Mike',contact:'mike@example.com',photo:''};render()}function begin(){state.phase='cindy5';state.question=0;state.view='workspace';render()}function workspace(){state.view='workspace';render()}function pick(i){state.pick=i;render()}function answer(){if(state.pick===null){alert('Choose one answer.');return}let p=state.phase==='cindy5'?'Mike':'Cindy';state.answers[p].push(state.pick);state.pick=null;if(state.question<4)state.question++;else{state.question=0;state.phase=state.phase==='cindy5'?'mike5':'more_mike'}render()}function choose(x){state.more[state.viewer]=x;if(state.phase==='more_mike'){state.phase='more_cindy';state.viewer='Cindy'}else state.phase=state.more.Mike==='more'&&state.more.Cindy==='more'?'reveal':'closed';render()}function connect(){state.phase='connected';render()}function send(){let text=$('message').value.trim();if(!text)return;state.thread.push({from:state.viewer,text});render()}render();
</script></body></html>
